<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Modal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #0e2a38, #05141d);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: #171923;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #2d3748;
      overflow: hidden;
    }

    .tab-header {
      display: flex;
      border-bottom: 1px solid #2d3748;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      background: #11131a;
      border: none;
      color: #718096;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #171923;
      color: #fff;
      border-bottom: 2px solid #7c3aed;
    }

    .form-container {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: #a0aec0;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #1a202c;
      border: 1px solid #4a5568;
      border-radius: 8px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: #7c3aed;
    }

    /* Red outline and red line error */
    input.error-border {
      border-color: #e53e3e !important;
    }

    .error-text {
      display: none;
      color: #e53e3e;
      font-size: 0.8rem;
      margin-top: 5px;
    }

    .error-text.show {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="tab-header">
      <button class="tab-btn" id="loginTab">Login</button>
      <button class="tab-btn active" id="signUpTab">Sign Up</button>
    </div>

    <div class="form-container">
      <form id="authForm">
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <input type="text" id="username" placeholder="Enter your username" autocomplete="off" required />
          </div>
          <div class="error-text" id="usernameError">Username already exists.</div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>
        </div>

        <div class="form-group" id="confirmPassGroup">
          <label>Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Sign Up & Start Event</button>
      </form>
    </div>
  </div>

  <script>
    // Pull saved users from browser memory, or start with default demo usernames
    let users = JSON.parse(localStorage.getItem('cyber_users')) || ['admin', 'testuser'];

    let mode = 'signup';

    const loginTab = document.getElementById('loginTab');
    const signUpTab = document.getElementById('signUpTab');
    const confirmGroup = document.getElementById('confirmPassGroup');
    const confirmInput = document.getElementById('confirmPassword');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const usernameError = document.getElementById('usernameError');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('authForm');

    // Tab switcher
    loginTab.onclick = () => setMode('login');
    signUpTab.onclick = () => setMode('signup');

    function setMode(newMode) {

      mode = newMode;
      clearError();
      if (mode === 'signup') {
        signUpTab.classList.add('active');
        loginTab.classList.remove('active');
        confirmGroup.style.display = 'block';
        confirmInput.required = true;
        submitBtn.textContent = 'Sign Up & Start Event';
        checkUsernameUnique();
      } else {
        loginTab.classList.add('active');
        signUpTab.classList.remove('active');
        confirmGroup.style.display = 'none';
        confirmInput.required = false;
        submitBtn.textContent = 'Login & Start Event';
      }
    }

    const initMode = new URLSearchParams(window.location.search).get('mode');
    if (initMode === 'login') {
      setMode('login');
    } else {
      setMode('signup');
    }

    // Check unique username in real-time
    usernameInput.addEventListener('input', checkUsernameUnique);

    function checkUsernameUnique() {
      const enteredName = usernameInput.value.trim().toLowerCase();

      if (mode === 'signup' && enteredName && users.includes(enteredName)) {
        usernameInput.classList.add('error-border');
        usernameError.classList.add('show');
        submitBtn.disabled = true;
        return false;
      } else {
        clearError();
        return true;
      }
    }

    function clearError() {
      usernameInput.classList.remove('error-border');
      usernameError.classList.remove('show');
      submitBtn.disabled = false;
    }

    // Form submit
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = usernameInput.value.trim().toLowerCase();
      const pass = passwordInput.value;

      if (mode === 'signup') {
        if (!checkUsernameUnique()) return;

        if (pass !== confirmInput.value) {
          alert('Passwords do not match');
          return;
        }

        // Save new user
        users.push(user);
        localStorage.setItem('cyber_users', JSON.stringify(users));
        alert('Account created successfully! You can now log in.');
        setMode('login');
      } else {
        if (!users.includes(user)) {
          alert('User not found. Please Sign Up first.');
          return;
        }
        localStorage.setItem('cyber_current_user', user);
        alert('Logged in successfully!');
        const nextPage = new URLSearchParams(window.location.search).get('next');
        window.location.href = nextPage && /^\/[a-zA-Z0-9_./-]+\.html$/.test(nextPage) ? nextPage : '../index.html';
      }
    });
  </script>
</body>
</html>
