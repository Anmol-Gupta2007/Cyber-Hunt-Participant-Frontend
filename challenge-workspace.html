<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Hunt | Challenge Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap">

  <style>
    :root {
      --bg: #061a29;
      --head: #062338;
      --panel: #062338;
      --panel-inner: #092c44;
      --line: #4aa8e9;
      --line-subtle: rgba(74, 168, 233, 0.28);
      --white: #edf2f4;
      --muted: #b0c9db;
      --muted-dark: #7a9cb6;
      --blue: #58aaeb;
      --blue-light: #72b9f0;
      --blue-dim: rgba(88, 170, 235, 0.18);
      --green: #10b981;
      --green-dark: #064e3b;
      --green-glow: rgba(16, 185, 129, 0.35);
      --red: #ef4444;
      --red-dark: #450a0a;
      --yellow: #f59e0b;
      --locked: #567287;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(88, 170, 235, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(88, 170, 235, 0.08) 0%, transparent 40%);
      color: var(--white);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 12px 18px;
      gap: 14px;
      max-width: 1560px;
      margin: 0 auto;
    }

    /* TOP BAR */
    .topbar {
      background: var(--head);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1.5px solid var(--line-subtle);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      gap: 16px;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--white);
    }

    .topbar-brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--line);
      box-shadow: 0 0 8px rgba(88, 170, 235, 0.4);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(16px, 1.4vw, 20px);
      letter-spacing: -0.5px;
      color: var(--white);
    }

    .brand-tag {
      background: var(--panel-inner);
      color: var(--blue-light);
      border: 1px solid var(--line-subtle);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* LIVE EVENT TIMER */
    .timer-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(6, 26, 41, 0.85);
      border: 1.5px solid var(--blue);
      box-shadow: 0 0 15px rgba(88, 170, 235, 0.25);
      padding: 6px 16px;
      border-radius: 6px;
      font-family: 'DM Mono', monospace;
    }

    .timer-icon {
      color: var(--blue-light);
      font-size: 16px;
      animation: pulse-icon 2s infinite ease-in-out;
    }

    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px var(--blue)); }
    }

    .timer-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .timer-display {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* TOP ACTIONS */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .nav-btn-link {
      background: var(--panel-inner);
      border: 1px solid var(--line-subtle);
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn-link:hover {
      color: var(--white);
      border-color: var(--line);
      background: rgba(74, 168, 233, 0.15);
    }

    .score-badge-box {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--green);
      color: #6ee7b7;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-era-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .topbar-era-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--line);
      box-shadow: 0 0 8px rgba(88, 170, 235, 0.4);
      transition: transform 0.2s ease;
    }

    .topbar-era-logo:hover {
      transform: scale(1.08);
    }

    /* STAGES PROGRESS ROW (Reference Image Top Section) */
    .stages-progress-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 6px;
    }

    .stage-pill-card {
      background: var(--panel);
      border: 1.5px solid var(--line-subtle);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .stage-pill-card.active {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.08);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25), inset 0 0 15px rgba(16, 185, 129, 0.1);
    }

    .stage-pill-card.solved {
      border-color: var(--blue);
      background: rgba(88, 170, 235, 0.08);
    }

    .stage-pill-card.locked {
      border-color: rgba(74, 168, 233, 0.15);
      background: rgba(6, 26, 41, 0.5);
      opacity: 0.7;
    }

    .stage-pill-card.final {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(69, 10, 10, 0.2);
    }

    .stage-pill-icon {
      font-size: 20px;
    }

    .stage-pill-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--white);
    }

    .stage-pill-status {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .stage-pill-card.active .stage-pill-status { color: var(--green); }
    .stage-pill-card.solved .stage-pill-status { color: var(--blue-light); }
    .stage-pill-card.locked .stage-pill-status { color: var(--locked); }
    .stage-pill-card.final .stage-pill-status { color: var(--red); }

    /* SECTION HEADER */
    .section-title-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--line-subtle);
      margin-bottom: 8px;
    }

    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: clamp(15px, 1.3vw, 18px);
      font-weight: 700;
      color: var(--blue-light);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    .section-title .cmd-prompt {
      color: var(--blue);
    }

    /* CHALLENGES CONTAINER */
    .challenges-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* CHALLENGE PHASE CARD */
    .phase-card {
      background: var(--panel);
      border: 1.5px solid var(--line-subtle);
      border-radius: 8px;
      padding: 20px 24px;
      position: relative;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .phase-card.active-phase {
      border-color: var(--line);
      box-shadow: 0 0 25px rgba(74, 168, 233, 0.2), inset 0 0 20px rgba(6, 26, 41, 0.6);
    }

    .phase-card.solved-phase {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(6, 35, 56, 0.85);
    }

    .phase-card.locked-phase {
      opacity: 0.55;
      filter: grayscale(0.4);
      pointer-events: none;
    }

    .phase-card-inner {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .phase-card-inner {
        grid-template-columns: 1fr;
      }
      .stages-progress-bar {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* LEFT SIDE OF PHASE CARD */
    .phase-main {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .phase-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--blue-light);
      letter-spacing: 0.5px;
    }

    .phase-status-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .phase-status-badge.solved {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid var(--green);
    }

    .phase-status-badge.active {
      background: rgba(88, 170, 235, 0.2);
      color: var(--blue-light);
      border: 1px solid var(--blue);
    }

    .phase-status-badge.locked {
      background: rgba(86, 114, 135, 0.2);
      color: var(--locked);
      border: 1px solid var(--locked);
    }

    /* PROMPT QUESTION BLOCK WITH LEFT BRACKET ACCENT */
    .question-box {
      background: var(--panel-inner);
      border-left: 3px solid var(--line);
      padding: 14px 18px;
      border-radius: 0 6px 6px 0;
      color: var(--white);
      font-size: 14.5px;
      line-height: 1.6;
      position: relative;
    }

    .question-code-snippet {
      margin-top: 8px;
      background: rgba(4, 18, 29, 0.8);
      padding: 8px 12px;
      border-radius: 4px;
      color: #7dd3fc;
      font-family: 'DM Mono', monospace;
      font-size: 13.5px;
      word-break: break-all;
      border: 1px dashed rgba(74, 168, 233, 0.3);
    }

    /* INPUT ROW */
    .submission-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 4px;
    }

    .answer-input {
      flex: 1;
      background: rgba(4, 18, 29, 0.9);
      border: 1.5px solid var(--line-subtle);
      border-radius: 6px;
      padding: 12px 16px;
      color: var(--white);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .answer-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 12px rgba(88, 170, 235, 0.3);
    }

    .answer-input.input-success {
      border-color: var(--green) !important;
      background: rgba(6, 78, 59, 0.2);
    }

    .answer-input.input-error {
      border-color: var(--red) !important;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .btn-submit-flag {
      background: var(--blue);
      color: #04121d;
      border: 1.5px solid var(--blue);
      border-radius: 6px;
      padding: 12px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(88, 170, 235, 0.35);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-submit-flag:hover:not(:disabled) {
      background: #72b9f0;
      box-shadow: 0 0 18px rgba(88, 170, 235, 0.6);
      transform: translateY(-1px);
    }

    .btn-submit-flag:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-submit-flag:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .feedback-msg {
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 4px;
      display: none;
    }
    .feedback-msg.show-err {
      display: block;
      color: var(--red);
    }
    .feedback-msg.show-ok {
      display: block;
      color: #6ee7b7;
    }

    /* RIGHT SIDE OF PHASE CARD (Hints & Points) */
    .phase-sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 1px solid rgba(74, 168, 233, 0.15);
      padding-left: 20px;
    }

    @media (max-width: 900px) {
      .phase-sidebar {
        border-left: none;
        border-top: 1px solid rgba(74, 168, 233, 0.15);
        padding-left: 0;
        padding-top: 16px;
      }
    }

    .hint-card {
      background: rgba(6, 26, 41, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 6px;
      padding: 12px 14px;
      transition: all 0.2s ease;
    }

    .hint-card.hint-locked {
      border-color: rgba(86, 114, 135, 0.25);
      background: rgba(4, 18, 29, 0.5);
    }

    .hint-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .hint-title {
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint-title.locked-title {
      color: var(--locked);
    }

    .btn-toggle-hint {
      background: transparent;
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'DM Mono', monospace;
    }

    .btn-toggle-hint:hover {
      background: rgba(245, 158, 11, 0.2);
      color: #fde68a;
    }

    .hint-body {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .meta-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(4, 18, 29, 0.6);
      border: 1px solid var(--line-subtle);
      border-radius: 6px;
      padding: 10px 14px;
    }

    .metric-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-label {
      font-size: 10px;
      color: var(--muted-dark);
      text-transform: uppercase;
      font-weight: 700;
    }

    .metric-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- TOP HEADER -->
    <header class="topbar">
      <div class="brand-wrap">
        <img src="logo-graphic-geeks.png" alt="Graphic Geeks" class="topbar-brand-logo">
        <span class="brand-title">CYBER HUNT</span>
        <span class="brand-tag">PHASE ARENA</span>
      </div>

      <!-- LIVE EVENT TIMER -->
      <div class="timer-pill" title="Live Event Countdown">
        <span class="timer-icon">&#9201;</span>
        <span class="timer-label">TIME REMAINING:</span>
        <span class="timer-display" id="eventCountdown">01:59:59</span>
      </div>

      <!-- TOP ACTIONS -->
      <div class="top-actions">
        <a class="nav-btn-link" href="dashboard.html" title="Back to Stages Dashboard">&larr; Dashboard</a>
        <div class="score-badge-box">
          <span>&#9733;</span>
          <span id="currentScore">0 PTS</span>
        </div>
        <a class="topbar-era-wrap" href="https://geu.ac.in" target="_blank" rel="noopener" title="Graphic Era University">
          <img src="logo-graphic-era.png" alt="Graphic Era University" class="topbar-era-logo" width="32" height="32">
        </a>
      </div>
    </header>

    <!-- STAGES PROGRESS ROW (Reference Image) -->
    <section class="stages-progress-bar" id="stagesProgressBar">
      <div class="stage-pill-card active" id="stagePill1">
        <span class="stage-pill-icon">&#128275;</span>
        <span class="stage-pill-title">Stage 1:</span>
        <span class="stage-pill-status">[Active]</span>
      </div>
      <div class="stage-pill-card locked" id="stagePill2">
        <span class="stage-pill-icon">&#128274;</span>
        <span class="stage-pill-title">Stage 2:</span>
        <span class="stage-pill-status">[Locked]</span>
      </div>
      <div class="stage-pill-card locked" id="stagePill3">
        <span class="stage-pill-icon">&#128274;</span>
        <span class="stage-pill-title">Stage 3:</span>
        <span class="stage-pill-status">[Locked]</span>
      </div>
      <div class="stage-pill-card final" id="stagePill4">
        <span class="stage-pill-icon">&#128681;</span>
        <span class="stage-pill-title">Stage 4:</span>
        <span class="stage-pill-status">[Final]</span>
      </div>
    </section>

    <!-- EVENT CHALLENGES SECTION HEADER -->
    <div class="section-title-wrap">
      <div class="section-title">
        <span class="cmd-prompt">&gt;_</span> EVENT CHALLENGES (PHASES 1 - 6)
      </div>
      <div style="font-size: 12px; color: var(--muted);">
        Sequential Security Decryption Matrix
      </div>
    </div>

    <!-- CHALLENGES LIST -->
    <main class="challenges-list" id="challengesContainer">
      <!-- Generated via JS -->
    </main>
  </div>

  <script>
    // CTF CHALLENGE PHASES DEFINITIONS
    const CHALLENGES = [
      {
        id: 1,
        title: "PHASE 1: Cryptic Cipher",
        question: "Decode the following base64 string to retrieve the access key:",
        snippet: "R3JhcGhpY0dlZWtzMjAyNg==",
        hint: "Standard Base64 encoding. Use an online decoder or browser console atob().",
        points: 50,
        acceptedAnswers: ["graphicgeeks2026", "graphic geeks 2026", "graphicgeeks"]
      },
      {
        id: 2,
        title: "PHASE 2: Web Forensics",
        question: "Inspect the network request headers of the target server. What is the value of the hidden 'X-Flag' parameter?",
        snippet: "GET /api/v1/auth/stage2 HTTP/1.1 -> Response Header: X-Flag: GEU_HEADER_INTRUSION_KEY",
        hint: "Check Developer Tools > Network Tab > Response Headers or inspect the simulated header parameter above.",
        points: 100,
        acceptedAnswers: ["geu_header_intrusion_key", "geuheaderintrusionkey"]
      },
      {
        id: 3,
        title: "PHASE 3: Binary Matrix",
        question: "Convert the 8-bit binary ASCII sequence into plaintext:",
        snippet: "01000011 01011001 01000010 01000101 01010010",
        hint: "8-bit binary ASCII representation. Each byte represents a single character.",
        points: 100,
        acceptedAnswers: ["cyber"]
      },
      {
        id: 4,
        title: "PHASE 4: Cryptographic Hash",
        question: "An embedded MD5 checksum hash was recovered from security logs: 5d41402abc4b2a76b9719d911017c592. What was the original plaintext word?",
        snippet: "MD5: 5d41402abc4b2a76b9719d911017c592",
        hint: "Standard MD5 hash lookup. A very common 5-letter English greeting word.",
        points: 150,
        acceptedAnswers: ["hello"]
      },
      {
        id: 5,
        title: "PHASE 5: Database Auth Bypass",
        question: "Identify the standard numeric tautology operand used to complete this SQL injection login bypass: ' OR '1'='___' --",
        snippet: "SELECT * FROM participants WHERE username = 'admin' AND pass = '' OR '1'='1' --",
        hint: "Standard tautology logic condition: 1 equals 1.",
        points: 200,
        acceptedAnswers: ["1", "'1'='1'"]
      },
      {
        id: 6,
        title: "PHASE 6: Master Flag (Final Escape Room Key)",
        question: "Combine the recovered digital keys to formulate the final Graphic Era escape room flag:",
        snippet: "CYBERHUNT{GEU_VICTORY_2026}",
        hint: "Type the master flag formatted as CYBERHUNT{GEU_VICTORY_2026}.",
        points: 500,
        acceptedAnswers: ["cyberhunt{geu_victory_2026}", "geu_victory_2026"]
      }
    ];

    // STATE INITIALIZATION
    let userState = {
      revealedHints: JSON.parse(localStorage.getItem('cyber_revealed_hints')) || [],
      solvedPhases: JSON.parse(localStorage.getItem('cyber_solved_phases')) || [],
      score: parseInt(localStorage.getItem('cyber_total_score'), 10) || 0
    };

    // COUNTDOWN TIMER LOGIC (2 Hours default, persistent)
    let eventDurationSeconds = parseInt(localStorage.getItem('cyber_timer_remaining'), 10);
    if (isNaN(eventDurationSeconds) || eventDurationSeconds <= 0) {
      eventDurationSeconds = 2 * 60 * 60; // 2 hours
    }

    const timerDisplay = document.getElementById('eventCountdown');

    function updateTimer() {
      if (eventDurationSeconds <= 0) {
        timerDisplay.textContent = "00:00:00 - TIME EXPIRED";
        timerDisplay.style.color = "var(--red)";
        return;
      }
      eventDurationSeconds--;
      localStorage.setItem('cyber_timer_remaining', eventDurationSeconds);

      const hours = String(Math.floor(eventDurationSeconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((eventDurationSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(eventDurationSeconds % 60).padStart(2, '0');
      timerDisplay.textContent = `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    window.toggleHint = function(phaseId) {
      const idx = userState.revealedHints.indexOf(phaseId);
      if (idx > -1) {
        userState.revealedHints.splice(idx, 1);
      } else {
        userState.revealedHints.push(phaseId);
      }
      localStorage.setItem('cyber_revealed_hints', JSON.stringify(userState.revealedHints));
      renderApp();
    };

    // RENDER CHALLENGES & STAGES
    function renderApp() {
      const container = document.getElementById('challengesContainer');
      container.innerHTML = '';

      // Determine highest active phase
      const solvedSet = new Set(userState.solvedPhases);
      let activePhaseId = 1;
      while (solvedSet.has(activePhaseId) && activePhaseId <= CHALLENGES.length) {
        activePhaseId++;
      }

      // Update Top Stages Progress Bar
      updateStagePills(solvedSet, activePhaseId);

      // Update Score
      document.getElementById('currentScore').textContent = `${userState.score} PTS`;

      // Render Each Phase Card
      CHALLENGES.forEach(c => {
        const isSolved = solvedSet.has(c.id);
        const isActive = (c.id === activePhaseId);
        const isLocked = (!isSolved && c.id > activePhaseId);
        const isHintRevealed = userState.revealedHints.includes(c.id);

        const card = document.createElement('article');
        card.className = `phase-card ${isSolved ? 'solved-phase' : ''} ${isActive ? 'active-phase' : ''} ${isLocked ? 'locked-phase' : ''}`;
        card.id = `phaseCard_${c.id}`;

        let hintHtml = '';
        if (isLocked) {
          hintHtml = `
            <div class="hint-card hint-locked">
              <div class="hint-header">
                <div class="hint-title locked-title">
                  <span>&#128274;</span> HINT LOCKED
                </div>
              </div>
              <div class="hint-body" style="color: var(--locked); font-style: italic;">
                Complete previous phases to unlock this hint.
              </div>
            </div>
          `;
        } else {
          hintHtml = `
            <div class="hint-card">
              <div class="hint-header">
                <div class="hint-title">
                  <span>&#128161;</span> HINT
                </div>
                <button class="btn-toggle-hint" onclick="toggleHint(${c.id})">
                  ${isHintRevealed ? 'Hide' : 'Reveal'}
                </button>
              </div>
              ${isHintRevealed ? `
                <div class="hint-body">${c.hint}</div>
              ` : `
                <div class="hint-body" style="color: var(--muted-dark); font-style: italic;">
                  Click 'Reveal' to view clue hint.
                </div>
              `}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="phase-card-inner">
            <div class="phase-main">
              <div class="phase-header">
                <h2 class="phase-title">${c.title}</h2>
                <span class="phase-status-badge ${isSolved ? 'solved' : (isActive ? 'active' : 'locked')}">
                  ${isSolved ? '&#10003; SOLVED' : (isActive ? 'ACTIVE' : '&#128274; LOCKED')}
                </span>
              </div>

              <div class="question-box">
                <div>${c.question}</div>
                ${c.snippet ? `<div class="question-code-snippet">${c.snippet}</div>` : ''}
              </div>

              <div class="submission-row">
                <input 
                  type="text" 
                  class="answer-input ${isSolved ? 'input-success' : ''}" 
                  id="input_${c.id}" 
                  placeholder="${isSolved ? 'Solved: Access Granted' : 'Type your answer here...'}" 
                  value="${isSolved ? '&#10003; ANSWER VERIFIED' : ''}"
                  ${isSolved || isLocked ? 'disabled' : ''}
                  autocomplete="off"
                />
                <button 
                  class="btn-submit-flag" 
                  id="btn_${c.id}" 
                  onclick="submitAnswer(${c.id})"
                  ${isSolved || isLocked ? 'disabled' : ''}
                >
                  ${isSolved ? 'SOLVED' : 'SUBMIT'}
                </button>
              </div>

              <div class="feedback-msg" id="feedback_${c.id}"></div>
            </div>

            <div class="phase-sidebar">
              ${hintHtml}

              <div class="meta-metrics">
                <div class="metric-group">
                  <span class="metric-label">Points Gained</span>
                  <span class="metric-val">+${c.points}</span>
                </div>
                <div class="metric-group" style="text-align: right;">
                  <span class="metric-label">Status</span>
                  <span style="font-size: 12px; font-weight: 700; color: ${isSolved ? 'var(--green)' : (isActive ? 'var(--blue-light)' : 'var(--locked)')};">
                    ${isSolved ? 'Completed' : (isActive ? 'In Progress' : 'Locked')}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function updateStagePills(solvedSet, activePhaseId) {
      const stagePill1 = document.getElementById('stagePill1');
      const stagePill2 = document.getElementById('stagePill2');
      const stagePill3 = document.getElementById('stagePill3');
      const stagePill4 = document.getElementById('stagePill4');

      // Stage 1
      if (solvedSet.has(1) && solvedSet.has(2)) {
        stagePill1.className = "stage-pill-card solved";
        stagePill1.querySelector('.stage-pill-status').textContent = "[Solved]";
      } else {
        stagePill1.className = "stage-pill-card active";
        stagePill1.querySelector('.stage-pill-status').textContent = "[Active]";
      }

      // Stage 2
      if (solvedSet.has(3) && solvedSet.has(4)) {
        stagePill2.className = "stage-pill-card solved";
        stagePill2.querySelector('.stage-pill-icon').innerHTML = "&#128275;";
        stagePill2.querySelector('.stage-pill-status').textContent = "[Solved]";
      } else if (solvedSet.has(1) && solvedSet.has(2)) {
        stagePill2.className = "stage-pill-card active";
        stagePill2.querySelector('.stage-pill-icon').innerHTML = "&#128275;";
        stagePill2.querySelector('.stage-pill-status').textContent = "[Active]";
      } else {
        stagePill2.className = "stage-pill-card locked";
        stagePill2.querySelector('.stage-pill-icon').innerHTML = "&#128274;";
        stagePill2.querySelector('.stage-pill-status').textContent = "[Locked]";
      }

      // Stage 3
      if (solvedSet.has(5)) {
        stagePill3.className = "stage-pill-card solved";
        stagePill3.querySelector('.stage-pill-icon').innerHTML = "&#128275;";
        stagePill3.querySelector('.stage-pill-status').textContent = "[Solved]";
      } else if (solvedSet.has(3) && solvedSet.has(4)) {
        stagePill3.className = "stage-pill-card active";
        stagePill3.querySelector('.stage-pill-icon').innerHTML = "&#128275;";
        stagePill3.querySelector('.stage-pill-status').textContent = "[Active]";
      } else {
        stagePill3.className = "stage-pill-card locked";
        stagePill3.querySelector('.stage-pill-icon').innerHTML = "&#128274;";
        stagePill3.querySelector('.stage-pill-status').textContent = "[Locked]";
      }

      // Stage 4 Final
      if (solvedSet.has(6)) {
        stagePill4.className = "stage-pill-card solved";
        stagePill4.querySelector('.stage-pill-status').textContent = "[Victory]";
      } else if (solvedSet.has(5)) {
        stagePill4.className = "stage-pill-card active";
        stagePill4.querySelector('.stage-pill-status').textContent = "[Final Active]";
      } else {
        stagePill4.className = "stage-pill-card final";
        stagePill4.querySelector('.stage-pill-status').textContent = "[Final]";
      }
    }

    // SUBMIT & VALIDATION HANDLER
    window.submitAnswer = function(phaseId) {
      const challenge = CHALLENGES.find(c => c.id === phaseId);
      if (!challenge) return;

      const input = document.getElementById(`input_${phaseId}`);
      const feedback = document.getElementById(`feedback_${phaseId}`);
      const val = input.value.trim().toLowerCase();

      if (!val) {
        input.classList.add('input-error');
        feedback.className = "feedback-msg show-err";
        feedback.textContent = "Please enter an answer.";
        setTimeout(() => input.classList.remove('input-error'), 500);
        return;
      }

      const isCorrect = challenge.acceptedAnswers.some(ans => ans.toLowerCase() === val);

      if (isCorrect) {
        feedback.className = "feedback-msg show-ok";
        feedback.innerHTML = `&#10003; Correct! Access key accepted. +${challenge.points} PTS awarded.`;

        if (!userState.solvedPhases.includes(phaseId)) {
          userState.solvedPhases.push(phaseId);
          userState.score += challenge.points;
          localStorage.setItem('cyber_solved_phases', JSON.stringify(userState.solvedPhases));
          localStorage.setItem('cyber_total_score', userState.score);
        }

        setTimeout(() => {
          renderApp();
        }, 600);
      } else {
        input.classList.add('input-error');
        feedback.className = "feedback-msg show-err";
        feedback.textContent = "Incorrect access key / answer. Please analyze clues and try again.";
        setTimeout(() => input.classList.remove('input-error'), 600);
      }
    };

    // INITIAL RENDER
    renderApp();
  </script>
</body>
</html>
